{% extends "layout.html" %}

{% block title %}Add Vehicle{% endblock %}

{% block content %}
<div class="page-header">

    <div>
        <h1 class="page-title">Add vehicle</h1>

        <p class="page-subtitle">
            Add a new vehicle to dealership inventory.
        </p>
    </div>

</div>

<div class="form-card form-card--narrow">

    <form method="POST"
          action="{{ url_for('vehicle.add_vehicle') }}"
          class="form-stack">

        <div class="form-group">
            <label for="vehicle_make">Make</label>

            <input
                type="text"
                id="vehicle_make"
                name="vehicle_make"
                required
            >
        </div>

        <div class="form-group">
            <label for="vehicle_model">Model</label>

            <input
                type="text"
                id="vehicle_model"
                name="vehicle_model"
                required
            >
        </div>

        <div class="form-group">
            <label for="vehicle_year">Year</label>

            <input
                type="number"
                id="vehicle_year"
                name="vehicle_year"
                min="1900"
                required
            >
        </div>

        <div class="form-group">
            <label for="vehicle_vin">VIN</label>

            <input
                type="text"
                id="vehicle_vin"
                name="vehicle_vin"
                required
            >
        </div>

        <div class="form-group">
            <label for="vehicle_price">Price ($)</label>

            <input
                type="number"
                step="0.01"
                min="0"
                id="vehicle_price"
                name="vehicle_price"
                required
            >
        </div>

        <div class="form-group">
            <label for="vehicle_mileage">Mileage</label>

            <input
                type="number"
                min="0"
                id="vehicle_mileage"
                name="vehicle_mileage"
                required
            >
        </div>

        <div class="form-group">
            <label for="vehicle_condition">Condition</label>

            <select
                id="vehicle_condition"
                name="vehicle_condition"
                required
            >
                <option value="">Select condition</option>
                <option value="new">New</option>
                <option value="used">Used</option>
            </select>
        </div>

        <div class="form-group">
            <label for="vehicle_availability_status">
                Availability status
            </label>

            <select
                id="vehicle_availability_status"
                name="vehicle_availability_status"
                required
            >
                <option value="">Select status</option>
                <option value="available">Available</option>
                <option value="sold">Sold</option>
                <option value="maintenance">Maintenance</option>
            </select>
        </div>

        <div class="form-actions">

            <button type="submit"
                    class="btn btn--primary">
                Add vehicle
            </button>

            <a href="{{ url_for('vehicle.vehicles') }}"
               class="btn btn--secondary">
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
