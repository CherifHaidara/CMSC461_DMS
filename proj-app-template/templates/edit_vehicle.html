{% extends "layout.html" %}

{% block title %}Edit Vehicle{% endblock %}

{% block content %}
<div class="page-header">

    <div>
        <h1 class="page-title">Edit vehicle</h1>

        <p class="page-subtitle">
            Update vehicle inventory information.
        </p>
    </div>

</div>

<div class="form-card form-card--narrow">

    <form method="POST"
          action="{{ url_for('vehicle.edit_vehicle', vehicle_id=vehicle.vehicle_id) }}"
          class="form-stack">

        <div class="form-group">
            <label for="vehicle_make">Make</label>

            <input
                type="text"
                id="vehicle_make"
                name="vehicle_make"
                value="{{ vehicle.vehicle_make }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="vehicle_model">Model</label>

            <input
                type="text"
                id="vehicle_model"
                name="vehicle_model"
                value="{{ vehicle.vehicle_model }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="vehicle_year">Year</label>

            <input
                type="number"
                id="vehicle_year"
                name="vehicle_year"
                value="{{ vehicle.vehicle_year }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="vehicle_vin">VIN</label>

            <input
                type="text"
                id="vehicle_vin"
                name="vehicle_vin"
                value="{{ vehicle.vehicle_vin }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="vehicle_price">Price ($)</label>

            <input
                type="number"
                step="0.01"
                id="vehicle_price"
                name="vehicle_price"
                value="{{ vehicle.vehicle_price }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="vehicle_mileage">Mileage</label>

            <input
                type="number"
                id="vehicle_mileage"
                name="vehicle_mileage"
                value="{{ vehicle.vehicle_mileage }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="vehicle_condition">Condition</label>

            <select
                id="vehicle_condition"
                name="vehicle_condition"
                required
            >
                <option value="New"
                    {% if vehicle.vehicle_condition == "New" %}
                        selected
                    {% endif %}>
                    New
                </option>

                <option value="Used"
                    {% if vehicle.vehicle_condition == "Used" %}
                        selected
                    {% endif %}>
                    Used
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="vehicle_availability_status">
                Availability status
            </label>

            <select
                id="vehicle_availability_status"
                name="vehicle_availability_status"
                required
            >
                <option value="Available"
                    {% if vehicle.vehicle_availability_status == "Available" %}
                        selected
                    {% endif %}>
                    Available
                </option>

                <option value="Sold"
                    {% if vehicle.vehicle_availability_status == "Sold" %}
                        selected
                    {% endif %}>
                    Sold
                </option>
            </select>
        </div>

        <div class="form-actions">

            <button type="submit"
                    class="btn btn--primary">
                Save changes
            </button>

            <a href="{{ url_for('vehicle.vehicles') }}"
               class="btn btn--secondary">
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
