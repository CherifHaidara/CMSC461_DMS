{% extends "layout.html" %}

{% block title %}Add Part — Service #{{ service.service_id }}{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Add Part</h1>
        <p class="page-subtitle">
            Service #{{ service.service_id }} — {{ service.service_type }}
            ({{ service.vehicle_label }}, {{ service.service_date }})
        </p>
    </div>
    <a href="{{ url_for('service.service_detail', service_id=service.service_id) }}" class="btn btn--secondary btn--sm">Back to Service</a>
</div>

<div class="card card--padded card--measure-sm">
    <form method="POST" action="{{ url_for('service.add_part', service_id=service.service_id) }}">

        <div class="form-group">
            <label for="part_name">Part Name</label>
            <input type="text" id="part_name" name="part_name"
                   placeholder="e.g. Oil Filter, Brake Pad Set, Spark Plug" required>
        </div>

        <div class="form-group">
            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" name="quantity" min="1" value="1" required>
        </div>

        <div class="form-group">
            <label for="part_cost">Unit Cost ($)</label>
            <input type="number" id="part_cost" name="part_cost" step="0.01" min="0" placeholder="0.00" required>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn--primary">Add Part</button>
            <a href="{{ url_for('service.service_detail', service_id=service.service_id) }}" class="btn btn--secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
