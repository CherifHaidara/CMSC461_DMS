{% extends "layout.html" %}

{% block title %}Add Customer{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Add customer</h1>
        <p class="page-subtitle">
            Register a new customer in the system.
        </p>
    </div>
</div>

<div class="form-card form-card--narrow">

    <form method="POST"
          action="{{ url_for('customer.add_customer') }}"
          class="form-stack">

        <div class="form-group">
            <label for="customer_name">Customer name</label>
            <input
                type="text"
                id="customer_name"
                name="customer_name"
                required
            >
        </div>

        <div class="form-group">
            <label for="customer_address">Address</label>
            <input
                type="text"
                id="customer_address"
                name="customer_address"
                required
            >
        </div>

        <div class="form-group">
            <label for="customer_email">Email</label>
            <input
                type="email"
                id="customer_email"
                name="customer_email"
                required
            >
        </div>

        <div class="form-group">
            <label>Phone numbers</label>
            <div id="phone-numbers-container">
                <div class="phone-input-group" style="display: flex; gap: 0.5rem; margin-bottom: 0.5rem;">
                    <input
                        type="text"
                        name="phone_numbers"
                        class="phone-input"
                        placeholder="Enter phone number"
                        required
                    >
                </div>
            </div>
            <button type="button" id="add-phone-btn" class="btn btn--secondary btn--sm" style="margin-top: 0.5rem;">
                + Add phone number
            </button>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn--primary">
                Add customer
            </button>

            <a href="{{ url_for('customer.customers') }}"
               class="btn btn--secondary">
                Cancel
            </a>
        </div>

    </form>

</div>

<script>
document.getElementById('add-phone-btn').addEventListener('click', function(e) {
    e.preventDefault();
    const container = document.getElementById('phone-numbers-container');
    const newGroup = document.createElement('div');
    newGroup.className = 'phone-input-group';
    newGroup.style.display = 'flex';
    newGroup.style.gap = '0.5rem';
    newGroup.style.marginBottom = '0.5rem';
    
    newGroup.innerHTML = `
        <input
            type="text"
            name="phone_numbers"
            class="phone-input"
            placeholder="Enter phone number"
        >
        <button type="button" class="btn btn--danger btn--sm remove-phone-btn">Remove</button>
    `;
    
    container.appendChild(newGroup);
    
    // Add remove button handler
    newGroup.querySelector('.remove-phone-btn').addEventListener('click', function(e) {
        e.preventDefault();
        newGroup.remove();
    });
});

// Add remove button handler to existing phone inputs
document.querySelectorAll('.remove-phone-btn').forEach(btn => {
    btn.addEventListener('click', function(e) {
        e.preventDefault();
        this.parentElement.remove();
    });
});
</script>
{% endblock %}
