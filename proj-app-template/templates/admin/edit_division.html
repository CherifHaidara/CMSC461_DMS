{% extends "admin/base_admin.html" %}

{% block title %}Edit division · Admin{% endblock %}

{% block admin_content %}
<div class="admin-form-header">
    <h1>Edit division</h1>
</div>

<div class="admin-form-card">
    <form method="POST" action="{{ url_for('admin.edit_division', division_id=division.division_id) }}" class="form-stack">
        <div class="form-group">
            <label for="division_name">Division name *</label>
            <input type="text" id="division_name" name="division_name" required value="{{ division.division_name }}" autocomplete="off">
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4">{{ division.description or '' }}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-submit">Save changes</button>
            <a href="{{ url_for('admin.view_divisions') }}" class="btn-cancel">Cancel</a>
        </div>
    </form>

    <div class="form-actions form-actions-secondary">
        <form method="POST" action="{{ url_for('admin.delete_division', division_id=division.division_id) }}" onsubmit="return confirm('Remove this division and all assigned departments?');">
            <button type="submit" class="btn btn-danger">Remove division</button>
        </form>
    </div>
</div>
{% endblock %}
