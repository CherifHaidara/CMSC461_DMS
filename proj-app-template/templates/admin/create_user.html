{% extends "admin/base_admin.html" %}

{% block title %}Create user · Admin{% endblock %}

{% block admin_content %}
<div class="admin-form-header">
    <h1>Create new user</h1>
</div>

<div class="admin-form-card">
    <form method="POST" action="{{ url_for('admin.create_user') }}" class="form-grid">
        <div class="form-group">
            <label for="username">Username *</label>
            <input type="text" id="username" name="username" required autocomplete="off">
        </div>
        <div class="form-group">
            <label for="password">Password *</label>
            <input type="password" id="password" name="password" required autocomplete="off">
        </div>
        <div class="form-group">
            <label for="first_name">First Name *</label>
            <input type="text" id="first_name" name="first_name" required>
        </div>
        <div class="form-group">
            <label for="last_name">Last Name *</label>
            <input type="text" id="last_name" name="last_name" required>
        </div>
        <div class="form-group">
            <label for="emp_email">Email *</label>
            <input type="email" id="emp_email" name="emp_email" required>
        </div>
        <div class="form-group">
            <label for="emp_phone">Phone *</label>
            <input type="tel" id="emp_phone" name="emp_phone" required>
        </div>
        <div class="form-group">
            <label for="department_id">Department *</label>
            <select id="department_id" name="department_id" required>
                <option value="">Select Department</option>
                {% for dept in departments %}
                <option value="{{ dept.department_id }}">{{ dept.department_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="role_id">Role *</label>
            <select id="role_id" name="role_id" required>
                <option value="">Select Role</option>
                {% for role in roles %}
                <option value="{{ role.role_id }}">{{ role.role_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-actions form-actions--full">
            <button type="submit" class="btn-submit">Create user</button>
            <a href="{{ url_for('admin.view_users') }}" class="btn-cancel">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
