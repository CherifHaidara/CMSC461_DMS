{% extends "admin/base_admin.html" %}

{% block title %}Create department · Admin{% endblock %}

{% block admin_content %}
<div class="admin-form-header">
    <h1>Add new department</h1>
</div>

<div class="admin-form-card">
    <form method="POST" action="{{ url_for('admin.create_department') }}" class="form-stack">
        <div class="form-group">
            <label for="department_name">Department name *</label>
            <input type="text" id="department_name" name="department_name" required autocomplete="off">
        </div>

        <div class="form-group">
            <label for="division_id">Division *</label>
            <select id="division_id" name="division_id" required>
                <option value="">-- Select a division --</option>
                {% for division in divisions %}
                    <option value="{{ division.division_id }}" {% if division.division_id == selected_division_id %}selected{% endif %}>
                        {{ division.division_name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4"></textarea>
        </div>

        <div class="form-group">
            <label for="status">Status *</label>
            <select id="status" name="status" required>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
            </select>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-submit">Create department</button>
            <a href="{{ url_for('admin.view_divisions') }}" class="btn-cancel">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
