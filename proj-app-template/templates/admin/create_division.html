{% extends "admin/base_admin.html" %}

{% block title %}Create division · Admin{% endblock %}

{% block admin_content %}
<div class="admin-form-header">
    <h1>Create new division</h1>
</div>

<div class="admin-form-card">
    <form method="POST" action="{{ url_for('admin.create_division') }}" class="form-stack">
        <div class="form-group">
            <label for="division_name">Division name *</label>
            <input type="text" id="division_name" name="division_name" required autocomplete="off">
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4"></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-submit">Create division</button>
            <a href="{{ url_for('admin.view_divisions') }}" class="btn-cancel">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
